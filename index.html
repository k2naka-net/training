<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>脆弱性対応証明書 発行所</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
  /* Layout: centered column. Dark "console" card (theme-independent) → an award-certificate (賞状) with gold foil + red 朱印 seal */
  :root{
    --bg:#e9e6db; --panel:#faf7ef; --panel2:#f3efe4; --fg:#211d15; --muted:#60594a;
    --line:#d6cfbe; --accent:#2f7d52; --accent-ink:#1d5636;
    --gold:#a67c1f; --gold-foil:#c79a3a; --seal:#b23325; --amber:#bb7a16; --danger:#bb4332;
    --sans:"IBM Plex Sans JP",system-ui,sans-serif;
    --serif:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --con-bg:#0c1110; --con-fg:#8ff0b2; --con-dim:#497a5c; --con-amber:#ecb44e; --con-red:#ef7f6c;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e1210; --panel:#161c18; --panel2:#1b221d; --fg:#e9ede3; --muted:#9ba893;
    --line:#2c342d; --accent:#5fcf8c; --accent-ink:#8fe0ad;
    --gold:#d8af52; --gold-foil:#e9c977; --seal:#e07a68; --amber:#e0a94a; --danger:#e07a68;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1210; --panel:#161c18; --panel2:#1b221d; --fg:#e9ede3; --muted:#9ba893;
    --line:#2c342d; --accent:#5fcf8c; --accent-ink:#8fe0ad;
    --gold:#d8af52; --gold-foil:#e9c977; --seal:#e07a68; --amber:#e0a94a; --danger:#e07a68;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:34px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:580px;margin:0 auto}

  .brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .brand svg{flex:none;width:38px;height:38px}
  .brand .bt{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--muted);line-height:1.45}
  .brand .bt b{display:block;color:var(--accent);font-size:.74rem;letter-spacing:.1em}

  h1{font-family:var(--serif);font-weight:800;font-size:2rem;line-height:1.2;margin:0 0 .45rem;
    text-wrap:balance;letter-spacing:.02em}
  .lede{color:var(--muted);margin:0 0 1.5rem;font-size:.94rem}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}
  .mode{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    border-radius:10px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;transition:.14s}
  .mode b{display:block;font-size:.84rem;font-weight:700}
  .mode span{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
  .mode[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--panel2));
    box-shadow:0 0 0 1px var(--accent) inset}
  .mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  form{display:flex;flex-direction:column;gap:15px}
  label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:700}
  label .hint{font-weight:400;color:var(--muted);font-size:.72rem}
  input{font:inherit;font-size:.95rem;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--fg);min-width:0;width:100%}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .toolrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:2px}
  .sndtoggle{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    font:600 .75rem var(--mono);letter-spacing:.06em;border-radius:999px;padding:7px 13px;cursor:pointer}
  .sndtoggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
  .run{font:700 1.02rem/1 var(--sans);letter-spacing:.06em;color:#fff;
    background:linear-gradient(180deg,var(--accent),var(--accent-ink));
    border:none;border-radius:11px;padding:15px;cursor:pointer;transition:filter .15s,transform .05s;flex:1;min-width:160px}
  .run:hover{filter:brightness(1.08)}
  .run:active{transform:translateY(1px)}
  .fine{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-align:center;margin-top:20px;line-height:1.75}

  /* console */
  .console{background:var(--con-bg);border:1px solid #1b2a20;border-radius:13px;padding:17px;
    font-family:var(--mono);font-size:.77rem;color:var(--con-fg);min-height:260px;max-height:62vh;overflow-y:auto;
    box-shadow:inset 0 0 70px rgba(0,0,0,.55)}
  .console .ln{white-space:pre-wrap;word-break:break-word;margin:1px 0}
  .console .dim{color:var(--con-dim)} .console .amber{color:var(--con-amber)} .console .red{color:var(--con-red)}
  .console .phase{color:#cdeede;border-top:1px dashed #27463a;margin-top:9px;padding-top:7px}
  .cursor{display:inline-block;width:.62ch;height:1em;transform:translateY(2px);background:var(--con-fg);animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .gauge{margin-top:13px;font-family:var(--mono);font-size:.7rem;color:var(--con-dim);display:flex;align-items:center;gap:10px}
  .gauge .bar{flex:1;height:8px;border-radius:5px;background:#16241b;overflow:hidden;border:1px solid #223a2c}
  .gauge .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f7d52,#8ff0b2);transition:width .2s linear}
  .gauge .pct{min-width:3.2ch;text-align:right;color:var(--con-fg)}

  /* certificate */
  .cert{position:relative;background:
      radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 60%),var(--panel);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 18px 50px -24px rgba(0,0,0,.5)}
  .cert::before{content:"";position:absolute;inset:7px;border:1.5px solid color-mix(in srgb,var(--gold) 55%,transparent);
    border-radius:11px;pointer-events:none}
  .cert::after{content:"認 定";position:absolute;inset:0;display:grid;place-content:center;
    font-family:var(--serif);font-weight:800;font-size:8rem;letter-spacing:.3em;
    color:color-mix(in srgb,var(--accent) 7%,transparent);pointer-events:none;z-index:0;user-select:none}
  .cert > *{position:relative;z-index:1}
  .cert-top{padding:26px 24px 16px;text-align:center}
  .ribbon{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.24em;
    color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);
    border-radius:999px;padding:4px 14px;margin-bottom:12px}
  .cert h2{font-family:var(--serif);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:.14em}
  .cert .en{font-family:var(--mono);font-size:.64rem;letter-spacing:.28em;color:var(--muted);margin-top:4px}
  .rule{height:2px;width:70px;margin:13px auto 0;background:linear-gradient(90deg,transparent,var(--gold-foil),transparent)}

  .scorewrap{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 24px 4px}
  .dial{position:relative;width:132px;height:132px;flex:none}
  .dial svg{width:100%;height:100%;display:block}
  .dial .track{fill:none;stroke:color-mix(in srgb,var(--muted) 24%,transparent);stroke-width:9}
  .dial .val{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
  .dial .score{font-family:var(--serif);font-weight:800;font-size:2.3rem;fill:var(--fg)}
  .dial .pt{font-family:var(--mono);font-size:.62rem;fill:var(--muted);letter-spacing:.1em}
  .rankbox{text-align:center}
  .rank{font-family:var(--serif);font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:.02em}
  .rank-S{color:var(--gold-foil)} .rank-A{color:var(--accent)} .rank-B{color:var(--accent-ink)}
  .rank-C{color:var(--amber)} .rank-D{color:var(--danger)}
  .ranklab{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;color:var(--muted);margin-top:4px}
  .stars{font-size:1.15rem;letter-spacing:.14em;color:var(--gold-foil);margin-top:7px}

  .verdict{margin:16px 24px 0;padding:13px 15px;border-radius:10px;
    background:color-mix(in srgb,var(--accent) 11%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);font-size:.9rem;font-weight:500;text-align:center}

  .meta{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:18px 24px 0;font-size:.82rem}
  .meta dt{color:var(--muted);font-family:var(--mono);font-size:.72rem;white-space:nowrap}
  .meta dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}

  .findings{margin-top:20px;border-top:1px solid var(--line);padding:18px 24px 4px}
  .findings h3{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .finding{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
  .finding:last-child{border-bottom:none}
  .cve{font-family:var(--mono);font-size:.68rem;color:var(--accent);white-space:nowrap;padding-top:3px;min-width:116px}
  .fbody{min-width:0;flex:1}
  .fname{font-size:.88rem;font-weight:500}
  .fmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{font-family:var(--mono);font-size:.64rem;padding:2px 8px;border-radius:999px;border:1px solid}
  .sev-1{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .sev-2{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
  .sev-3{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
  .st-fixed{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .st-wa{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
  .st-inv{color:var(--muted);border-color:var(--line)}

  .quotes{margin-top:20px;border-top:1px solid var(--line);padding:18px 24px 4px}
  .quotes h3{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
  .quote{font-family:var(--serif);font-size:.95rem;line-height:1.7;padding:9px 0 9px 15px;border-left:3px solid var(--gold-foil);color:var(--fg)}
  .quote + .quote{margin-top:8px}

  /* per-mode certificate accents (light) */
  .cert.cloud{--accent:#2f72c4;--accent-ink:#2359a0;--gold:#7fa8d6;--gold-foil:#a9c6e6;--seal:#2f72c4}
  .cert.designer{--accent:#d14f86;--accent-ink:#b03a6c;--gold:#c98aa8;--gold-foil:#e3a9c4;--seal:#d6568a}
  .cert.network{--accent:#c56a1e;--accent-ink:#9e5316;--gold:#d6a067;--gold-foil:#e6c199;--seal:#c56a1e}
  .cert.night{--accent:#6a4fc4;--accent-ink:#5339a0;--gold:#9a86d6;--gold-foil:#bfaee6;--seal:#6a4fc4}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    .cert.cloud{--accent:#6fb0f2;--accent-ink:#a9cff8;--gold:#a9c6e6;--gold-foil:#c6ddf2;--seal:#6fb0f2}
    .cert.designer{--accent:#f49bc0;--accent-ink:#f9c2da;--gold:#e3a9c4;--gold-foil:#f2c8dc;--seal:#f49bc0}
    .cert.network{--accent:#e8a24e;--accent-ink:#f2c489;--gold:#e6c199;--gold-foil:#f0d6b3;--seal:#e8a24e}
    .cert.night{--accent:#a78ff2;--accent-ink:#c6b6f8;--gold:#bfaee6;--gold-foil:#d6caf2;--seal:#a78ff2}
  }}
  :root[data-theme="dark"] .cert.cloud{--accent:#6fb0f2;--accent-ink:#a9cff8;--gold:#a9c6e6;--gold-foil:#c6ddf2;--seal:#6fb0f2}
  :root[data-theme="dark"] .cert.designer{--accent:#f49bc0;--accent-ink:#f9c2da;--gold:#e3a9c4;--gold-foil:#f2c8dc;--seal:#f49bc0}
  :root[data-theme="dark"] .cert.network{--accent:#e8a24e;--accent-ink:#f2c489;--gold:#e6c199;--gold-foil:#f0d6b3;--seal:#e8a24e}
  :root[data-theme="dark"] .cert.night{--accent:#a78ff2;--accent-ink:#c6b6f8;--gold:#bfaee6;--gold-foil:#d6caf2;--seal:#a78ff2}

  .sig{margin:16px 24px 0;padding:13px 15px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .sig .sl{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .sig .hex{font-family:var(--mono);font-size:.66rem;color:var(--accent-ink);word-break:break-all;line-height:1.7}

  .sealbox{display:flex;align-items:center;gap:14px;margin:18px 24px 0}
  .seal{flex:none;width:76px;height:76px}
  .issuer{font-size:.76rem;color:var(--muted);line-height:1.6}
  .issuer b{color:var(--fg);font-family:var(--serif);font-weight:800;font-size:.92rem;letter-spacing:.06em}

  .cert-foot{margin-top:18px;padding:15px 24px 22px;border-top:1px solid var(--line);
    font-size:.71rem;color:var(--muted);line-height:1.7}
  .cert-foot b{color:var(--danger)}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{flex:1;min-width:150px;font:600 .92rem var(--sans);border-radius:11px;padding:13px;cursor:pointer;transition:.14s}
  .btn-copy{color:var(--fg);background:var(--panel);border:1px solid var(--line)}
  .btn-copy:hover{border-color:var(--accent);color:var(--accent)}
  .btn-again{color:#fff;background:linear-gradient(180deg,var(--accent),var(--accent-ink));border:none}
  .btn-again:hover{filter:brightness(1.08)}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  @media (max-width:430px){
    h1{font-size:1.62rem}
    .modes{grid-template-columns:1fr}
    .cert::after{font-size:5.4rem}
    .cve{min-width:100%;padding-top:0}
    .finding{flex-direction:column;gap:4px}
  }
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}.gauge .bar>i,.dial .val{transition:none}
  }
</style>

<canvas id="confetti" hidden></canvas>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <path d="M22 3 7 9v12c0 9.5 6.4 17 15 20 8.6-3 15-10.5 15-20V9L22 3Z"
        fill="none" stroke="var(--accent)" stroke-width="2.4"/>
      <path d="M14.5 22.5 20 28l10-11.5" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="bt"><b>全国脆弱性対応証明協会</b>National Vulnerability Response Certification Assoc.（※架空）</div>
  </div>

  <h1>脆弱性対応証明書 発行所</h1>
  <p class="lede">あなたという「システム」を緊急診断し、格調高い証明書を即日発行します。スコア・格付け・電子署名つき。通信は一切しません。全部ブラウザの中の冗談です。</p>

  <div id="stage">
    <div class="card" id="formCard">
      <div class="modes" id="modes" role="group" aria-label="診断モード">
        <button type="button" class="mode" data-mode="cloud" aria-pressed="true"><b>クラウド何でも屋</b><span>請求額と消し忘れに対応</span></button>
        <button type="button" class="mode" data-mode="designer" aria-pressed="false"><b>ホームページデザイナー</b><span>曖昧な修正指示に対応</span></button>
        <button type="button" class="mode" data-mode="network" aria-pressed="false"><b>ネットワーク屋</b><span>DNSとACLに対応</span></button>
        <button type="button" class="mode" data-mode="night" aria-pressed="false"><b>引退間近のインフラ屋</b><span>AI時代への耐性を測定</span></button>
      </div>
      <form id="scanForm">
        <label>因縁のあるIPアドレス
          <span class="hint">宿敵の座標。架空でOK（例: 203.0.113.金）</span>
          <input id="f_ip" value="203.0.113.金" autocomplete="off" spellcheck="false">
        </label>
        <label>あなたの二つ名
          <span class="hint">診断対象システムの名称として記録されます</span>
          <input id="f_name" value="深夜のデプロイ職人" autocomplete="off">
        </label>
        <label>隠しておきたい黒歴史
          <span class="hint">※墓場まで同行。証明書には出しません</span>
          <input id="f_pw" type="password" value="" placeholder="そっと入力…" autocomplete="off">
        </label>
        <label>掘り返したい過去
          <span class="hint">検査対象ディレクトリ</span>
          <input id="f_dir" value="/黒歴史/" autocomplete="off" spellcheck="false">
        </label>
        <div class="toolrow">
          <button type="button" class="sndtoggle" id="snd" aria-pressed="true">効果音 ： ON</button>
          <button class="run" type="submit">精密診断を開始</button>
        </div>
      </form>
    </div>
  </div>

  <p class="fine" id="fine">本サイトは外部へ一切通信しません。スキャン・署名・検証はすべて演出です。<br>実在の人物・サーバ・組織・CVE番号とは関係ありません。</p>
</div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var stage=$("#stage"), fine=$("#fine");
  var mode="cloud", sound=true;

  /* ---------- deterministic RNG ---------- */
  function hash(str){var h=2166136261>>>0;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  /* ---------- content ---------- */
  var PACKS={
    cloud:[
      {c:"CVE-請求-月末",n:"月末に届く請求額が、先月の自分の楽観的な見積もりを毎回上回る。"},
      {c:"CVE-消し忘れ-課金",n:"検証用に立てたリソースが、半年間ひっそりと課金され続けていた。"},
      {c:"CVE-IAM-拒否",n:"権限が足りず操作が弾かれるが、付けすぎると今度はレビューで怒られる。"},
      {c:"CVE-サーバーレス-幻",n:"「サーバーレス」を掲げながら、夜はサーバーのことばかり考えている。"},
      {c:"CVE-リージョン-異郷",n:"急いで作ったリソースが、気づけば遠い海外リージョンに建っている。"},
      {c:"CVE-無料枠-崖",n:"無料枠を一歩はみ出した瞬間、課金の崖から静かに転落する。"},
      {c:"CVE-タグ-無法",n:"命名とタグ付けのルールが、3人目の参加者で早くも形骸化する。"},
      {c:"CVE-とりあえず-VM",n:"あらゆる課題を、まず仮想マシンを1台立てることで解決しようとする。"},
      {c:"CVE-IaC-手動drift",n:"コードで管理しているはずの構成が、深夜の手作業で静かに乖離する。"},
      {c:"CVE-マルチクラウド-建前",n:"「特定ベンダに縛られない」と宣言しつつ、実質1社に全依存している。"}
    ],
    designer:[
      {c:"CVE-パッと-曖昧",n:"「なんかもっと、パッと華やかな感じで」という仕様外の要求を受理できず停止する。"},
      {c:"CVE-ロゴ-巨大化",n:"校了直前の「ロゴだけもう少し大きく」により、整えたレイアウトが一撃で崩壊する。"},
      {c:"CVE-余白-埋設要求",n:"意図して空けた余白を「寂しいから埋めて」と言われ、設計思想が静かに上書きされる。"},
      {c:"CVE-フォント-迷宮",n:"見出しの書体選びに3時間を溶かし、結局いちばん最初の候補に戻る。"},
      {c:"CVE-配色-無限",n:"配色の微調整が収束せず、ほぼ同じ緑の間を延々と往復し続ける。"},
      {c:"CVE-最終-真最終",n:"「最終_本当にこれで_final_v7」が最終でないことを、関係者全員が知っている。"},
      {c:"CVE-カーニング-不眠",n:"街の看板の字間が気になり安眠が妨げられる。職業病として常駐する。"},
      {c:"CVE-素材-72dpi",n:"「素材はこちらで用意します」と渡されたロゴが、低解像度のjpg1枚だった。"},
      {c:"CVE-戻して-後出し",n:"丁寧に直した直後に「やっぱり前の方が良かった」と元へ差し戻される。"},
      {c:"CVE-スマホ-追加",n:"納品間際に「これスマホでも見れるよね?」が、さも当然のように仕様へ追加される。"}
    ],
    network:[
      {c:"CVE-DNS-やはり",n:"原因を一通り疑った末、結局いつも名前解決に行き着く。"},
      {c:"CVE-ACL-黙殺",n:"疎通しない原因を3時間追い、最後に1行の許可ルール漏れが見つかる。"},
      {c:"CVE-サブネット-算数",n:"/26と/27の境界を、毎回電卓を叩いて確かめ直す。"},
      {c:"CVE-遅延-濡れ衣",n:"「ネットワークが遅い」の第一容疑者にされるが、真犯人は大抵アプリ側。"},
      {c:"CVE-ping-通過",n:"pingは元気に通るのに、肝心のアプリは一向に応答しない。"},
      {c:"CVE-VLAN-ループ",n:"善意で挿した1本の配線が、網全体を一瞬で沈黙させる。"},
      {c:"CVE-MTU-断片",n:"原因不明の通信不良を追い詰めると、パケットサイズに行き着く。"},
      {c:"CVE-冗長-共倒れ",n:"冗長化したはずの2台が、仲良く同じ瞬間に機能停止する。"},
      {c:"CVE-メンテ-深夜",n:"切替作業は、なぜか人類が最も眠い時間帯に割り当てられる。"},
      {c:"CVE-経路-非対称",n:"行きと帰りで経路が食い違い、通信が片道で迷子になる。"}
    ],
    night:[
      {c:"CVE-AI-即答",n:"若手が「AIに聞きました」と即答してくるが、裏取りを追う体力がもう残っていない。"},
      {c:"CVE-Runbook-陳腐化",n:"生涯をかけて手順書を書いてきたのに、AIが30秒で同等のものを生成する。"},
      {c:"CVE-経験則-論破",n:"長年の勘を頼りに語ると、AIに「よくある構成ミスですね」と穏やかに一蹴される。"},
      {c:"CVE-とりあえず-AI",n:"「とりあえず再起動」の次の切り札として、「とりあえずAIに貼る」を覚えた。"},
      {c:"CVE-プロンプト-不得手",n:"ラックの配線は完璧に把握しているが、プロンプトのコツだけは掴めない。"},
      {c:"CVE-武勇伝-要約",n:"障害対応の武勇伝が止まらないが、若手は横でAIに要約させている。"},
      {c:"CVE-AI障害-防衛線",n:"「AIが落ちたら結局だれが直すんだ」と、一人だけ本気で心配している。"},
      {c:"CVE-学習-徒労",n:"新技術をやっと覚えた矢先に、それごとAIエージェントへ置き換わる気配を感じる。"},
      {c:"CVE-CLI-手癖",n:"viとsedは手が勝手に動くのに、チャット欄へ日本語で頼むのには未だ慣れない。"},
      {c:"CVE-EOL-我が身",n:"製品のサポート終了日と自分の定年の日付を、つい見比べてしまう。"}
    ]
  };
  var MODE_LABEL={cloud:"クラウド何でも屋 診断",designer:"ホームページデザイナー 診断",network:"ネットワーク屋 診断",night:"引退間近のインフラ屋 診断"};
  var STATUS=[{t:"対応済（パッチ適用済）",c:"st-fixed"},{t:"回避策あり（気合いで対処）",c:"st-wa"},{t:"調査中（見なかったことに）",c:"st-inv"}];
  var SEV=[{t:"軽微",c:"sev-1"},{t:"中程度",c:"sev-2"},{t:"要経過観察",c:"sev-2"},{t:"持病（仕様）",c:"sev-3"}];
  var VERDICTS=[
    "対応済。貴殿のシステムは概ね完璧です。強いて言えば金曜日に弱い。",
    "深刻な脆弱性は検出されませんでした。むしろ働きすぎが心配です。",
    "総合判定：良好。既知の問題はすべて「仕様」として受理されました。",
    "致命的な欠陥なし。検出事項はいずれも人類共通の持病でした。",
    "セキュアです。ただしネコの前では全ての防御が無効化されます。"
  ];
  var INSPECTOR=["検査員 第壱号","主任鑑定士 ガバクラ丸","脆弱性ソムリエ 宵風","夜勤担当AI ver.3"];
  var QUOTES=[
    "「予算はないけど、クオリティは高めで」",
    "「まだ初稿ですよね? 完成度はこれからって感じで」（＝完成度を求めている）",
    "「シンプルにしてください。あ、情報は全部載せたいです」",
    "「若い人にウケる感じで、でも上品に、あと信頼感も」",
    "「他社さんのこのサイトみたいに。あ、パクリはダメですよ」",
    "「とりあえず仮でいいので、本番クオリティでお願いします」",
    "「センスにお任せします」（※のちに全ページ赤字で戻る）",
    "「ロゴ、気分で変わるかもしれません」",
    "「急ぎじゃないです」（＝明日の朝まで）",
    "「なんかこう、エモい感じ…わかります?」"
  ];

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function jdate(d){return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"}

  /* ---------- audio (generated, no files) ---------- */
  var actx=null;
  function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}return actx}
  function beep(freq,dur,type,vol){if(!sound)return;var c=ac();if(!c)return;try{
    var o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.value=freq;
    g.gain.value=0.0001;o.connect(g);g.connect(c.destination);var t=c.currentTime;
    g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o.stop(t+dur+0.02);}catch(e){}}
  function fanfare(){if(!sound)return;[0,120,240,440].forEach(function(ms,i){setTimeout(function(){beep([523,659,784,1047][i],i===3?0.5:0.16,"triangle",0.06)},ms)})}

  /* ---------- certificate ---------- */
  function build(d){
    var base=mode+"|"+d.ip+"|"+d.name+"|"+d.dir+"|"+d.pw;
    var seed=hash(base), rnd=mulberry32(seed);
    var pool=PACKS[mode].slice(), finds=[];
    var count=3+Math.floor(rnd()*2); // 3 or 4
    for(var i=0;i<count && pool.length;i++){var k=Math.floor(rnd()*pool.length);var v=pool.splice(k,1)[0];
      finds.push({v:v,s:STATUS[Math.floor(rnd()*STATUS.length)],sev:SEV[Math.floor(rnd()*SEV.length)]})}

    var score=72+Math.floor(rnd()*28); // 72..99
    var rank=score>=96?"S":score>=88?"A":score>=80?"B":score>=74?"C":"D";
    var stars=Math.max(2,Math.min(5,Math.round(score/20)));
    var starStr="";for(var s=0;s<5;s++)starStr+=(s<stars?"★":"☆");
    var serial=("000000"+(seed%1000000)).slice(-6);
    var auth=("0000"+(((seed>>>7)*7)%10000)).slice(-4);
    var now=new Date();
    var renew=new Date(now.getFullYear()+1+(seed%3),now.getMonth(),now.getDate());
    var insp=INSPECTOR[seed%INSPECTOR.length];

    var hx="";for(var h=0;h<64;h++)hx+="0123456789abcdef"[Math.floor(rnd()*16)];
    var hxGrp=hx.replace(/(.{4})/g,"$1 ").trim();

    var R=52,C=2*Math.PI*R,off=C*(1-score/100);

    var rows="";
    finds.forEach(function(f){
      rows+='<div class="finding"><span class="cve">'+esc(f.v.c)+'</span><div class="fbody">'+
        '<div class="fname">'+esc(f.v.n)+'</div><div class="fmeta">'+
        '<span class="chip '+f.sev.c+'">深刻度：'+f.sev.t+'</span>'+
        '<span class="chip '+f.s.c+'">'+esc(f.s.t)+'</span></div></div></div>';
    });

    var quotesHTML="";
    if(mode==="designer"){
      var qpool=QUOTES.slice(),qs=[];
      for(var q=0;q<3 && qpool.length;q++){qs.push(qpool.splice(Math.floor(rnd()*qpool.length),1)[0])}
      var qrows="";qs.forEach(function(t){qrows+='<div class="quote">'+esc(t)+'</div>'});
      quotesHTML='<div class="quotes"><h3>付記 ・ クライアント名言録</h3>'+qrows+'</div>';
    }
    return ''+
    '<div class="cert '+mode+'" id="cert">'+
      '<div class="cert-top">'+
        '<span class="ribbon">'+esc(MODE_LABEL[mode])+'</span>'+
        '<h2>脆 弱 性 対 応 証 明 書</h2>'+
        '<div class="en">VULNERABILITY RESPONSE CERTIFICATE</div>'+
        '<div class="rule"></div>'+
      '</div>'+
      '<div class="scorewrap">'+
        '<div class="dial"><svg viewBox="0 0 132 132">'+
          '<circle class="track" cx="66" cy="66" r="'+R+'"></circle>'+
          '<circle class="val" cx="66" cy="66" r="'+R+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'"></circle>'+
          '<text class="score" x="66" y="70" text-anchor="middle">'+score+'</text>'+
          '<text class="pt" x="66" y="90" text-anchor="middle">／100 点</text>'+
        '</svg></div>'+
        '<div class="rankbox"><div class="rank rank-'+rank+'">'+rank+'</div>'+
          '<div class="ranklab">総合格付け</div><div class="stars">'+starStr+'</div></div>'+
      '</div>'+
      '<div class="verdict">'+esc(VERDICTS[seed%VERDICTS.length])+'</div>'+
      '<dl class="meta">'+
        '<dt>証明書番号</dt><dd>VDA-2026-'+serial+'</dd>'+
        '<dt>認定番号</dt><dd>認定第 '+auth+' 号</dd>'+
        '<dt>発行日</dt><dd>'+jdate(now)+'</dd>'+
        '<dt>次回更新期限</dt><dd>'+jdate(renew)+'</dd>'+
        '<dt>対象システム</dt><dd>'+esc(d.name||"名もなきシステム")+'</dd>'+
        '<dt>宿敵アドレス</dt><dd>'+esc(d.ip||"—")+'</dd>'+
        '<dt>検査領域</dt><dd>'+esc(d.dir||"/")+'</dd>'+
        '<dt>黒歴史</dt><dd>●●●●●●（墓場まで同行）</dd>'+
        '<dt>担当検査員</dt><dd>'+esc(insp)+'</dd>'+
      '</dl>'+
      '<div class="findings"><h3>検出事項（'+finds.length+'件）</h3>'+rows+'</div>'+
      quotesHTML+
      '<div class="sig"><div class="sl">電子署名（SHA-256 風・飾り）</div><div class="hex">'+hxGrp+'</div></div>'+
      '<div class="sealbox">'+sealSVG()+
        '<div class="issuer"><b>全国脆弱性対応証明協会</b><br>上記の者を当協会認定の「概ね大丈夫な人」として証する。</div></div>'+
      '<div class="cert-foot">本証明書は所持者の自己申告に基づき当協会が交付した<b>冗談</b>です。'+
        'いかなる通信・スキャン・署名・検証も実際には行っておらず、現実のセキュリティを一切保証しません。額に入れて飾るのは自由です。</div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn btn-copy" id="copyBtn">証明書の内容をコピー</button>'+
      '<button class="btn btn-again" id="againBtn">もう一度診断する</button>'+
    '</div>';
  }

  function sealSVG(){
    return '<svg class="seal" viewBox="0 0 80 80" aria-hidden="true">'+
      '<circle cx="40" cy="40" r="37" fill="none" stroke="var(--seal)" stroke-width="2.4"/>'+
      '<circle cx="40" cy="40" r="31" fill="none" stroke="var(--seal)" stroke-width="1"/>'+
      '<text x="40" y="30" text-anchor="middle" fill="var(--seal)" font-family="var(--serif)" font-weight="800" font-size="13" letter-spacing="1">対応</text>'+
      '<text x="40" y="47" text-anchor="middle" fill="var(--seal)" font-family="var(--serif)" font-weight="800" font-size="13" letter-spacing="1">証明</text>'+
      '<text x="40" y="63" text-anchor="middle" fill="var(--seal)" font-family="monospace" font-size="6" letter-spacing="1">CERTIFIED</text>'+
    '</svg>';
  }

  function plainText(){
    // read back from DOM for copy
    var c=$("#cert");if(!c)return"";
    var t=c.innerText.replace(/\n{3,}/g,"\n\n").trim();
    return t+"\n\n— 本証明書は冗談です（全国脆弱性対応証明協会／架空）";
  }

  /* ---------- confetti ---------- */
  function confetti(){
    if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var cv=$("#confetti");cv.hidden=false;
    var dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
    var ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
    var cols=["#2f7d52","#c79a3a","#b23325","#8ff0b2","#e9c977"];
    var P=[];for(var i=0;i<140;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.5,
      w:5+Math.random()*7,h:8+Math.random()*8,vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,
      a:Math.random()*6.28,va:-0.2+Math.random()*0.4,col:cols[i%cols.length]});
    var t0=performance.now();
    (function frame(t){
      var el=t-t0;ctx.clearRect(0,0,innerWidth,innerHeight);
      P.forEach(function(p){p.y+=p.vy;p.x+=p.vx;p.a+=p.va;p.vy+=0.02;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.col;
        ctx.globalAlpha=el>2200?Math.max(0,1-(el-2200)/700):1;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
      if(el<2900)requestAnimationFrame(frame);
      else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true;}
    })(t0);
  }

  /* ---------- scan ---------- */
  function runScan(d){
    fine.hidden=true;
    stage.innerHTML='<div class="console" id="con"><span class="cursor"></span></div>'+
      '<div class="gauge"><span>SCAN</span><div class="bar"><i id="bar"></i></div><span class="pct" id="pct">0%</span></div>';
    var con=$("#con"),bar=$("#bar"),pct=$("#pct");
    var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var ip=d.ip||"unknown",dir=d.dir||"/",nm=d.name||"system";
    var steps=[
      {p:"PHASE 1 / 初期化",c:"phase"},
      {t:"$ vdascan --mode "+mode+" --target \""+nm+"\" --deep --paranoid",c:"dim"},
      {t:"[*] 検査エンジン v3.1.4 を起動 ... OK"},
      {t:"[*] 乱数シードを確保 / 署名鍵をロード（ふり）... OK"},
      {p:"PHASE 2 / 経路探索",c:"phase"},
      {t:"[*] 宿敵 "+ip+" への経路を確認中 ..."},
      {t:"[*] hop 1  10.0.0.1    1.2ms",c:"dim"},
      {t:"[*] hop 2  "+ip+"   (架空のため応答なし／想定内)",c:"dim"},
      {t:"[*] ポート走査: 22,80,443 ... 開いてることにしておく",c:"dim"},
      {p:"PHASE 3 / 深層スキャン",c:"phase"},
      {t:"[*] ディレクトリ "+dir+" を再帰的に掘り返し中 ..."},
      {t:"[!] 黒歴史フォルダを検出 ████████████ 中身は見なかったことにします",c:"amber"},
      {t:"[*] 感情スタックのオーバーフローを走査 ..."},
      {p:"PHASE 4 / 照合",c:"phase"},
      {t:"[*] 人類共通脆弱性データベース（架空）と照合 ..."},
      {t:"[!] 既知の持病に複数ヒット。重症度を鑑定中 ...",c:"amber"},
      {p:"PHASE 5 / 署名",c:"phase"},
      {t:"[*] 所見をハッシュ化し、電子署名を付与（飾り）..."},
      {t:"[*] タイムスタンプを打刻 ... OK"},
      {p:"PHASE 6 / 発行",c:"phase"},
      {t:"[+] 総合スコアを算出。証明書を発行します",c:"amber"}
    ];
    var i=0;
    function next(){
      if(i>=steps.length){bar.style.width="100%";pct.textContent="100%";setTimeout(show,reduce?0:450);return}
      var s=steps[i],el=document.createElement("div");
      el.className="ln"+(s.c?" "+s.c:"");el.textContent=s.p||s.t;
      con.insertBefore(el,con.lastChild);
      i++;var p=Math.round(i/steps.length*100);bar.style.width=p+"%";pct.textContent=p+"%";
      con.scrollTop=con.scrollHeight;
      if(!s.p)beep(560+Math.random()*120,0.03,"square",0.025);
      setTimeout(next,reduce?0:(s.p?430:230+Math.random()*180));
    }
    function show(){
      stage.innerHTML=build(d);
      requestAnimationFrame(function(){var v=$(".val");if(v)v.style.strokeDashoffset=v.getAttribute("data-off");});
      $("#againBtn").addEventListener("click",reset);
      $("#copyBtn").addEventListener("click",copyCert);
      fanfare();confetti();
      $("#cert").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
    }
    next();
  }

  function copyCert(){
    var btn=$("#copyBtn"),txt=plainText();
    function done(ok){btn.textContent=ok?"コピーしました ✓":"手動で選択してコピーを";setTimeout(function(){btn.textContent="証明書の内容をコピー"},1900)}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){done(true)},function(){selectCert();done(false)});return}}catch(e){}
    selectCert();done(false);
  }
  function selectCert(){try{var c=$("#cert"),r=document.createRange();r.selectNode(c);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}

  /* ---------- wiring ---------- */
  var FORM=$("#formCard").outerHTML;
  function reset(){stage.innerHTML=FORM;fine.hidden=false;bind();window.scrollTo({top:0,behavior:"smooth"})}
  function bind(){
    $("#modes").querySelectorAll(".mode").forEach(function(b){
      b.setAttribute("aria-pressed",b.dataset.mode===mode?"true":"false");
      b.addEventListener("click",function(){mode=b.dataset.mode;
        $("#modes").querySelectorAll(".mode").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
        beep(660,0.04,"triangle",0.03);});
    });
    var sb=$("#snd");sb.setAttribute("aria-pressed",sound?"true":"false");sb.textContent="効果音 ： "+(sound?"ON":"OFF");
    sb.addEventListener("click",function(){sound=!sound;sb.setAttribute("aria-pressed",sound?"true":"false");
      sb.textContent="効果音 ： "+(sound?"ON":"OFF");if(sound){ac();beep(720,0.08,"triangle",0.04)}});
    $("#scanForm").addEventListener("submit",function(e){e.preventDefault();if(sound)ac();
      runScan({ip:$("#f_ip").value.trim(),name:$("#f_name").value.trim(),pw:$("#f_pw").value,dir:$("#f_dir").value.trim()||"/"});});
  }
  bind();
})();
</script>
